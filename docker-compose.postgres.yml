##
## Docker Compose — the local PostgreSQL the backend develops and tests against.
##
## The application stack is not in this repo's compose surface; this file holds
## only the database a developer needs running next to `bun run dev:backend` and
## `bun run --cwd packages/backend test`.
##
## Usage:
##   docker compose -f docker-compose.postgres.yml up -d postgres
##   docker compose -f docker-compose.postgres.yml logs -f postgres
##   docker compose -f docker-compose.postgres.yml down -v   # wipe (data is disposable)
##
## Then in packages/backend/.env:
##   DATABASE_URL=postgres://mercaria:mercaria@127.0.0.1:5435/mercaria_dev
##
## The test harness (packages/backend/vitest.pg.globalSetup.ts) reads
## TEST_DATABASE_URL — pointed at this same server — and creates its OWN
## throwaway database on it per run, so it never writes to mercaria_dev.
##

services:
  postgres:
    # PostGIS, not plain Postgres: Mercaria stores seller/store/pickup locations
    # and answers "near me" catalogue queries, so `CREATE EXTENSION postgis` has
    # to succeed before the first migration naming a `geography` column
    # (packages/backend/src/db/migrate.ts ensures it on every run).
    #
    # `postgis/postgis` is the PostGIS project's own image, pinned on BOTH
    # versions — Postgres 17 (matching the shared `oxy-postgres` RDS instance)
    # and PostGIS 3.5 — because a floating PostGIS minor is a floating set of
    # function volatilities, and a generated `geography` column requires
    # `ST_MakePoint` and the geometry→geography cast to be IMMUTABLE.
    #
    # When CI grows a Postgres service container it must pin the SAME image, so
    # a developer's database and CI's cannot disagree about what is installed.
    #
    # Debian-based rather than alpine: PostGIS publishes no alpine variant, and
    # this is a local dev dependency, not a shipped artefact.
    image: postgis/postgis:17-3.5
    # Raise the SHARED lock table above its 64 default.
    #
    # Every realdb file that creates its OWN throwaway database
    # (src/db/testDatabase.ts) migrates it with the real migrator, which applies
    # the whole chain in ONE transaction — so a single migration holds every
    # object lock it takes until commit. PostgreSQL sizes ONE shared lock table
    # from `max_locks_per_transaction * (max_connections +
    # max_prepared_transactions)`, so this is not a per-transaction cap and
    # concurrent migrations contend for a single pool.
    #
    # ## How many the suite needs is COUNTED, never written down here
    #
    # This comment used to say "the suite needs six (five private-database files
    # plus the shared globalSetup database)". It needed twelve. Nothing said so,
    # because the enforced value still happened to work — #849. A number somebody
    # has to remember to update is the artefact that went stale, so the count now
    # lives in a guard that recounts it on every build:
    #
    #     bun run validate:lock-capacity        (scripts/validate-lock-capacity.mjs)
    #
    # and you can recount it by hand with:
    #
    #     git grep -l createMercariaTestDatabase -- 'packages/backend/src/**/*.realdb.test.ts' | wc -l
    #
    # ## What this ceiling carries, measured
    #
    # By `packages/backend/scripts/lock-capacity-probe.ts` — N real migrations
    # through the real migrator entrypoint, launched together and escalated until
    # `out of shared memory`, with two independent witnesses that they genuinely
    # overlapped. On postgis/postgis:17-3.5, on 2026-08-21, at commit 9b18057,
    # with a 133-entry chain costing 5,986 locks per full-chain migration:
    #
    #     max_locks_per_transaction=256  -> 15 carried, the 16th exhausted
    #     max_locks_per_transaction=512  -> 31 carried, the 32nd exhausted
    #
    # Twelve are wanted today, so the headroom is three more private-database
    # files. Every figure here carries the chain length and the date it was taken
    # at, because a capacity that cannot expire visibly is the whole of #849.
    #
    # 512 is measured but NOT set, deliberately. Three files of headroom is
    # positive and the guard fails the build the moment it is not, so raising the
    # ceiling now would cost every developer a `--force-recreate` (the harness
    # asserts the floor and refuses a server below it) to buy runway nothing
    # needs yet. What the row buys is that the remedy is then a three-line edit
    # rather than twenty minutes of measurement at the moment somebody is
    # already blocked — the guard refuses any ceiling it holds no measurement
    # for, and 512 is one it holds.
    #
    # ## Correcting the record, because the old numbers are still quoted
    #
    # The table this replaces read "256 -> 12 concurrent migrations, 16th fails".
    # The 16 reproduces exactly. The 12 was never a capacity — it was the largest
    # N anybody had TESTED, and 13, 14 and 15 all carry. The lock-cost half was
    # right and has barely moved: measured against truncated copies of the chain,
    # one migration cost 5,818 locks at 109 entries and 5,986 at 133, so the
    # erosion is real and slow (~15 locks per migration added, against a budget of
    # ~90,000). The guard therefore PROJECTS the capacity onto the chain as it
    # stands rather than comparing today's file count against an old number.
    #
    # It has to be a server ARGUMENT: the setting is `postmaster` context, so
    # neither PGOPTIONS nor `ALTER SYSTEM` reaches it without a restart.
    #
    # CI raises the SAME floor on its service container, by a different
    # mechanism it is forced into (.github/workflows/ci.yml). Because those are
    # two mechanisms for one fact, `packages/backend/vitest.pg.globalSetup.ts`
    # ASSERTS the floor on whatever server it is handed — so a half-applied
    # change fails loudly in the environment that is wrong, instead of leaving
    # lock exhaustion reproducible in only one of them.
    command: postgres -c max_locks_per_transaction=256
    container_name: mercaria-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercaria
      POSTGRES_PASSWORD: mercaria
      # `mercaria_{env}`, with `_` rather than `-` because an unquoted Postgres
      # identifier cannot hold a hyphen.
      POSTGRES_DB: mercaria_dev
    ports:
      # 5435, and loopback-only. Several Oxy repos are routinely open at once on
      # the same machine and each binds its own local Postgres: oxy-api takes
      # 5432, Mention 5433, Homiio and Syra 5434. Mercaria takes the next free
      # one rather than colliding with a database somebody else is mid-migration
      # against.
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercaria -d mercaria_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mercaria-postgres-data:/var/lib/postgresql/data

volumes:
  mercaria-postgres-data:
