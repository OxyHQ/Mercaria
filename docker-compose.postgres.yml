##
## Docker Compose — the local PostgreSQL the backend develops and tests against.
##
## The application stack is not in this repo's compose surface; this file holds
## only the database a developer needs running next to `bun run dev:backend` and
## `bun run --cwd packages/backend test`.
##
## Usage:
##   docker compose -f docker-compose.postgres.yml up -d postgres
##   docker compose -f docker-compose.postgres.yml logs -f postgres
##   docker compose -f docker-compose.postgres.yml down -v   # wipe (data is disposable)
##
## Then in packages/backend/.env:
##   DATABASE_URL=postgres://mercaria:mercaria@127.0.0.1:5435/mercaria_dev
##
## The test harness (packages/backend/vitest.pg.globalSetup.ts) reads
## TEST_DATABASE_URL — pointed at this same server — and creates its OWN
## throwaway database on it per run, so it never writes to mercaria_dev.
##

services:
  postgres:
    # PostGIS, not plain Postgres: Mercaria stores seller/store/pickup locations
    # and answers "near me" catalogue queries, so `CREATE EXTENSION postgis` has
    # to succeed before the first migration naming a `geography` column
    # (packages/backend/src/db/migrate.ts ensures it on every run).
    #
    # `postgis/postgis` is the PostGIS project's own image, pinned on BOTH
    # versions — Postgres 17 (matching the shared `oxy-postgres` RDS instance)
    # and PostGIS 3.5 — because a floating PostGIS minor is a floating set of
    # function volatilities, and a generated `geography` column requires
    # `ST_MakePoint` and the geometry→geography cast to be IMMUTABLE.
    #
    # When CI grows a Postgres service container it must pin the SAME image, so
    # a developer's database and CI's cannot disagree about what is installed.
    #
    # Debian-based rather than alpine: PostGIS publishes no alpine variant, and
    # this is a local dev dependency, not a shipped artefact.
    image: postgis/postgis:17-3.5
    container_name: mercaria-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercaria
      POSTGRES_PASSWORD: mercaria
      # `mercaria_{env}`, with `_` rather than `-` because an unquoted Postgres
      # identifier cannot hold a hyphen.
      POSTGRES_DB: mercaria_dev
    ports:
      # 5435, and loopback-only. Several Oxy repos are routinely open at once on
      # the same machine and each binds its own local Postgres: oxy-api takes
      # 5432, Mention 5433, Homiio and Syra 5434. Mercaria takes the next free
      # one rather than colliding with a database somebody else is mid-migration
      # against.
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercaria -d mercaria_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mercaria-postgres-data:/var/lib/postgresql/data

volumes:
  mercaria-postgres-data:
