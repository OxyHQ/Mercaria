# Disposable WordPress + WooCommerce stack for the #69 real-store verification.
#
# Nothing here is a fixture: this is a real WordPress running a real WooCommerce
# against a real MariaDB. The only thing that is not production-shaped is that it
# is disposable and reachable through a cloudflared quick tunnel rather than a
# registered domain.
#
# The WordPress port is bound to LOOPBACK. The public entrance is the tunnel, so
# the container is never directly exposed.

name: mercaria-woo-e2e

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?generated by env.sh on first up}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?generated by env.sh on first up}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    # WordPress 7.0.x, because WooCommerce's current release requires WP >= 6.9
    # and refuses to install on anything older ("This plugin does not work with
    # your version of WordPress").
    image: wordpress:7.0.4-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WP_HOST_PORT:-8087}:80'
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?generated by env.sh on first up}
      #
      # There is deliberately NO `WORDPRESS_CONFIG_EXTRA` here.
      #
      # MEASURED on wordpress:7.0.4-php8.3-apache (2026-08-15): the image's
      # entrypoint contains ZERO occurrences of `WORDPRESS_CONFIG_EXTRA`
      # (`grep -c` on /usr/local/bin/docker-entrypoint.sh returns 0), so any
      # value passed is SILENTLY IGNORED. An earlier revision of this file
      # passed a block defining WP_HOME/WP_SITEURL, DISABLE_WP_CRON and a
      # forwarded-proto fix; none of it ever reached wp-config.php, and the site
      # worked anyway — which is precisely how a comment describing a mechanism
      # that does nothing survives.
      #
      # What actually carries each of those:
      #   - the public origin: the `home`/`siteurl` DATABASE OPTIONS, written by
      #     `wp core install --url` in seed.sh and re-written by up.sh on every
      #     new tunnel. There are no WP_HOME/WP_SITEURL constants at all.
      #   - https behind the tunnel: the IMAGE's own wp-config, which now ships
      #     an `HTTP_X_FORWARDED_PROTO` check. Without it `is_ssl()` would be
      #     false and WooCommerce would refuse key/secret Basic auth.
      #   - WP-Cron: left at WordPress's DEFAULT, i.e. ENABLED, which is what a
      #     real merchant site runs and what a plugin debouncing through
      #     `wp_schedule_single_event` needs. `wp cron test` confirms spawning.
    volumes:
      - wp_data:/var/www/html

  # Not started by `up`; invoked with `docker compose run --rm wpcli …`.
  wpcli:
    image: wordpress:cli-2.12
    profiles: ['cli']
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?generated by env.sh on first up}
    volumes:
      - wp_data:/var/www/html
      - ./php:/mercaria-scripts:ro
    user: '33:33'
    entrypoint: ['wp']
    command: ['--info']

volumes:
  db_data:
  wp_data:

networks:
  # An EXPLICIT subnet, not an automatic one.
  #
  # This host runs ~30 sibling compose stacks, which is exactly Docker's default
  # allocation (172.17-172.31/16 plus 192.168.0.0/16 in /20s). One more
  # auto-allocated network fails with "all predefined address pools have been
  # fully subnetted", and the tempting fix — `docker network prune` — reaches
  # into other agents' stacks. Naming a subnet in the otherwise-unused 10/8
  # space bypasses the pool and touches nobody. Override with
  # MERCARIA_WOO_E2E_SUBNET if 10.211.83.0/24 is ever taken.
  default:
    ipam:
      config:
        - subnet: ${MERCARIA_WOO_E2E_SUBNET:-10.211.83.0/24}
