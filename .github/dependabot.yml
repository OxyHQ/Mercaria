version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "@oxy.so/*"
      - dependency-name: "@alia.onl/*"
      - dependency-name: "@clarity.surf/*"
    # First-party SDKs only; third-party updates stay manual. The group
    # auto-merges via .github/workflows/automerge-first-party.yml.
    groups:
      oxy:
        patterns:
          - "@oxy.so/*"
          - "@alia.onl/*"
          - "@clarity.surf/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
