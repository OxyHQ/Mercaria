# AWS deploy workflow for the Mercaria API.
# Builds the linux/arm64 backend image, pushes it to ECR, and forces a new ECS
# deployment. AWS access is via the OIDC role oxy-github-deploy — no stored keys.
#
# NOTE (handoff): the ECS service `mercaria`, its task definition, ALB
# listener rule, ECR repo, and SSM parameter wiring do NOT exist yet. They live
# in oxy-infra (terraform-uswest2/) and must be provisioned there before this
# workflow can deploy. Until then this builds + pushes the image and skips the
# ECS step (the service-existence guard below handles that gracefully).
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: mercaria
  CLUSTER: oxy-cluster
  DOCKERFILE: Dockerfile

jobs:
  test:
    # x86, not ARM: this job needs the Postgres SERVICE CONTAINER below, and
    # GitHub-hosted ARM runners do not support service containers — a run that
    # requests one there dies before its first job with `action_required` and
    # zero jobs (measured on runs 31263904439 / 31263963083). The suite does
    # not care about the architecture; only the image build (deploy job) does.
    runs-on: ubuntu-latest

    services:
      # The backend suite needs a real PostGIS server (see ci.yml's Lint & Test
      # job — same block, same reasoning): vitest.pg.globalSetup.ts creates a
      # throwaway database on this server and refuses to run without one.
      # Pinned to the SAME image as docker-compose.postgres.yml, on BOTH versions.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: mercaria
          POSTGRES_PASSWORD: mercaria
          POSTGRES_DB: mercaria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercaria -d mercaria_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run --filter @mercaria/backend lint

      - run: bun run --filter @mercaria/backend test
        env:
          # Names the SERVER, never the database the tests use — the harness
          # creates and drops its own throwaway database on it (see ci.yml).
          TEST_DATABASE_URL: postgres://mercaria:mercaria@127.0.0.1:5432/mercaria_ci

      - run: bun run build:backend

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          SHARED="AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY REDIS_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET"
          echo "$SECRETS_JSON" | jq -r 'to_entries[] | select((.key|ascii_upcase) as $k | ($k=="GITHUB_TOKEN" or ($k|startswith("ACTIONS_")))|not) | [.key,.value]|@tsv' | \
          while IFS=$'\t' read -r k v; do
            [ -z "$k" ] && continue
            if [ -z "$v" ] || [ "$v" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $k; SSM unchanged"
              continue
            fi
            if [ "$k" = "REDIS_URL" ] && ! printf '%s' "$v" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
              echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
              continue
            fi
            case " $SHARED " in *" $k "*) path="/oxy/_shared/$k";; *) path="/oxy/$APP/$k";; esac
            aws ssm put-parameter --name "$path" --value "$v" --type SecureString --overwrite >/dev/null && echo "synced -> $path"
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            -f "$DOCKERFILE" \
            -t "$IMG:${{ github.sha }}" \
            -t "$IMG:latest" \
            --push \
            .

      - name: Deploy to ECS (rolling; skipped until the service exists)
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" = "ACTIVE" ]; then
            aws ecs update-service --cluster "$CLUSTER" --service "$APP" --force-new-deployment >/dev/null
            aws ecs wait services-stable --cluster "$CLUSTER" --services "$APP"
            echo "deployed $APP"
          else
            echo "ECS service $APP not created yet — image is in ECR, skipping deploy"
          fi
