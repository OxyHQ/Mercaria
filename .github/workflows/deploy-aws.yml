# AWS deploy workflow for the Mercaria API.
# Builds the linux/arm64 backend image, pushes it to ECR, applies the database
# migrations as ECS one-shot tasks, and forces a new ECS deployment. AWS access
# is via the OIDC role oxy-github-deploy — no stored keys.
#
# The infrastructure is PROVISIONED AND SERVING (verified 2026-08-08): service
# `mercaria` on cluster `oxy-cluster`, ECR repo `oxy/mercaria`, target group
# `oxy-mercaria` behind the shared ALB, and the SSM parameters under
# /oxy/mercaria that the task definition reads as secrets. It all lives in
# oxy-infra (terraform-uswest2/), which stays the source of truth for changing
# any of it — this workflow only deploys onto it.
#
# The service-existence guard below is therefore a GUARD, not the normal path:
# it finds the service ACTIVE on every ordinary run, and only short-circuits
# (image pushed to ECR, deploy and migrations skipped) if the service is ever
# torn down or renamed. A run that reports "not created yet" means the
# infrastructure moved, not that Mercaria is still awaiting its first
# provisioning.
#
# Migrations normally run as the pre/post one-shot pair around the rollout. Use
# `migration_phase=all` from workflow_dispatch only for a from-zero batch, where
# the whole journal has to be applied in one run before anything serves it — see
# the note on that step for why the pre/post pair cannot do it.
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      migration_phase:
        description: >-
          How to apply migrations. `pre-post` (default) applies the additive ones
          before the rollout and the destructive ones after. `all` applies
          everything in ONE run before the rollout — what a from-zero batch needs,
          and wrong for anything else.
        type: choice
        default: pre-post
        options:
          - pre-post
          - all

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: mercaria
  CLUSTER: oxy-cluster
  DOCKERFILE: Dockerfile
  # The PostgreSQL database the migration tasks below are allowed to touch.
  #
  # NOT cosmetic: the migrator refuses to run unless this matches the database its
  # DATABASE_URL actually resolves to, so a value that disagrees with the
  # provisioned database fails the deploy loudly instead of migrating some other
  # one.
  #
  # VERIFIED, not assumed: provisioned 2026-08-08 via oxy-infra runbook 30 — role
  # `mercaria` owns database `mercaria` on oxy-postgres, with PostGIS installed by
  # oxyadmin (it is not a trusted extension, so database ownership alone cannot
  # install it). The matching DATABASE_URL is already live: GitHub secret → SSM
  # /oxy/mercaria/DATABASE_URL → task definition oxy-mercaria:2.
  PG_DATABASE: mercaria

jobs:
  test:
    # x86, NOT the `ubuntu-24.04-arm` the deploy job uses, and TWO independent
    # things force that — worth stating both, because fixing either one alone
    # still leaves the job broken.
    #
    #  1. GitHub-hosted ARM runners do not support service containers at all. A
    #     run that requests one dies before its first job with `action_required`
    #     and zero jobs (measured on runs 31263904439 / 31263963083).
    #  2. Even where they are supported, `postgis/postgis` publishes linux/amd64
    #     ONLY — checked against the registry, where the tag's OCI index carries
    #     one platform entry plus an attestation. So the container below could
    #     not start on an ARM host regardless.
    #
    # Together those close the tempting repair: finding a multi-arch Postgres
    # image does NOT make an ARM runner workable here, and neither does waiting
    # for ARM service-container support while this image stays amd64-only.
    #
    # Nothing in this job needs ARM anyway — it lints, tests, and runs an esbuild
    # bundle, none of which is architecture-sensitive. Only `deploy` builds the
    # linux/arm64 image, and it stays on the ARM runner for that. Changing this
    # back for consistency with `deploy` re-breaks the job.
    runs-on: ubuntu-latest

    services:
      # The API suite needs a real PostGIS server: the `*.realdb.test.ts` files
      # run their SQL against a throwaway database the harness creates HERE
      # (see packages/backend/vitest.pg.globalSetup.ts).
      # Without it `vitest.pg.globalSetup.ts` throws and every deploy fails
      # before it starts.
      #
      # Pinned to the SAME image as docker-compose.postgres.yml and ci.yml, on
      # BOTH versions. A floating PostGIS minor is a floating set of function
      # volatilities, and the generated `geography` column requires
      # `ST_MakePoint` and the geometry→geography cast to be IMMUTABLE — so a
      # developer's database, CI's and this one must not be able to disagree
      # about what is installed.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: mercaria
          POSTGRES_PASSWORD: mercaria
          POSTGRES_DB: mercaria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercaria -d mercaria_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - run: bun run --filter @mercaria/backend lint

      # TEST_DATABASE_URL names the SERVER, never the database the tests use: the
      # harness creates its own throwaway database on it per run and drops it
      # afterwards, so `mercaria_ci` is never written to.
      - env:
          TEST_DATABASE_URL: postgres://mercaria:mercaria@127.0.0.1:5432/mercaria_ci
        run: bun run --filter @mercaria/backend test

      - run: bun run build:backend

  deploy:
    needs: test
    # Native arm64, matching the image this job builds.
    #
    # A CORRECTED RECORD, written down so the wrong version is not re-derived:
    # on 2026-08-08 every run of this workflow completed as `action_required`
    # with ZERO jobs, and this ARM label was blamed for it. It was not the label.
    # GitHub's run page gives the real reason — "GitHub detected that this
    # workflow file may be malicious. It will not run until someone with write
    # access approves it" — which is why a dispatch also produced zero jobs and
    # why the API's approve endpoint refuses (it only serves fork PRs). Two
    # measurements settle it: the first green deploy (run 31275312983) started
    # 20:05:05Z once approved and ran THIS job on THIS label, three minutes
    # before the commit that switched it to QEMU; and Syra's identical workflow
    # was blocked the same way with both jobs already on `ubuntu-latest`.
    # Emulated arm64 is much slower than native, so the label stays; a blocked
    # run needs a human to approve it, not a runner change.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          SHARED="AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY REDIS_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET"
          echo "$SECRETS_JSON" | jq -r 'to_entries[] | select((.key|ascii_upcase) as $k | ($k=="GITHUB_TOKEN" or ($k|startswith("ACTIONS_")))|not) | [.key,.value]|@tsv' | \
          while IFS=$'\t' read -r k v; do
            [ -z "$k" ] && continue
            if [ -z "$v" ] || [ "$v" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $k; SSM unchanged"
              continue
            fi
            if [ "$k" = "REDIS_URL" ] && ! printf '%s' "$v" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
              echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
              continue
            fi
            case " $SHARED " in *" $k "*) path="/oxy/_shared/$k";; *) path="/oxy/$APP/$k";; esac
            aws ssm put-parameter --name "$path" --value "$v" --type SecureString --overwrite >/dev/null && echo "synced -> $path"
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/arm64)
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            -f "$DOCKERFILE" \
            -t "$IMG:${{ github.sha }}" \
            -t "$IMG:latest" \
            --push \
            .

      # ── Migrations run as one-shot ECS tasks, around the rollout ─────────────
      #
      # Two phases, and the split is the whole point (see @oxyhq/db's phases.ts):
      # `pre` is additive and safe while the OLD image still serves, so it runs
      # BEFORE the service update; `post` drops and narrows, which would 500 the
      # old image, so it runs AFTER the new one is live. Every migration file
      # declares its own side, and the migrator refuses to guess for one that
      # does not.
      #
      # The task REUSES the service's live task definition and network
      # configuration rather than registering its own, which is what gives the
      # migrator the same DATABASE_URL secret, subnets and security groups the
      # service has. Only the command is overridden. That also means it runs the
      # image the task definition points at — the `:latest` tag this workflow
      # just pushed — so `run-task` gets the NEW image without a second revision.
      # If the task definition is ever pinned to an immutable tag, this step must
      # register a revision instead, or it will migrate using the OLD image.
      - name: Resolve the ECS one-shot shape
        id: ecs
        env:
          # Absent on a `push` trigger, where only the default is ever right.
          REQUESTED_PHASE: ${{ github.event.inputs.migration_phase }}
        run: |
          echo "phase_mode=${REQUESTED_PHASE:-pre-post}" >> "$GITHUB_OUTPUT"
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet — nothing to migrate or deploy against"
            exit 0
          fi
          TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].taskDefinition' --output text)
          NET=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].networkConfiguration' --output json)
          CONTAINER=$(aws ecs describe-task-definition --task-definition "$TD" --query 'taskDefinition.containerDefinitions[0].name' --output text)
          echo "task_definition=$TD" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          # JSON on one line: a GITHUB_OUTPUT value cannot span lines unhelped.
          echo "network=$(echo "$NET" | jq -c .)" >> "$GITHUB_OUTPUT"

      # Does this release contain a post-rollout migration at all? Grepped with
      # the pattern @oxyhq/db EXPORTS (`POST_PHASE_GREP_PATTERN`), never a copy —
      # `src/db/__tests__/deployWorkflow.test.ts` asserts this workflow contains
      # that exact string, so the two cannot drift. The grep is sound only
      # because the migrator separately proves every file carries exactly one
      # well-formed marker; without that a typo would read as "no post migration"
      # and the drop would never be applied by anything.
      - name: Detect a post-rollout migration in this release
        id: phases
        run: |
          if grep -rlE '^-- oxy:deploy-phase=post$' packages/backend/drizzle >/dev/null 2>&1; then
            echo "has_post=true" >> "$GITHUB_OUTPUT"
            echo "this release carries at least one post-rollout migration"
          else
            echo "has_post=false" >> "$GITHUB_OUTPUT"
            echo "no post-rollout migration in this release"
          fi

      # The CUTOVER path, chosen by hand from workflow_dispatch. One `all` run
      # applies the whole chain in journal order before the rollout, which the
      # pre/post pair cannot do: a `pre` migration queued behind an unapplied
      # `post` one BLOCKS by design, and the journal in packages/backend/drizzle
      # has exactly that shape. It is safe only on a database no image is serving
      # yet — which is also why it must never be the default. Measured: on an
      # empty database `--phase=pre` refuses and names both files, while `all`
      # applies all of them and leaves both later phases clean no-ops.
      - name: Migrate (all) — cutover only, never a normal release
        if: steps.ecs.outputs.status == 'ACTIVE' && steps.ecs.outputs.phase_mode == 'all'
        run: |
          .github/scripts/run-migration-task.sh all
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      - name: Migrate (pre) — before the rollout
        if: steps.ecs.outputs.status == 'ACTIVE' && steps.ecs.outputs.phase_mode != 'all'
        run: |
          .github/scripts/run-migration-task.sh pre
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      - name: Deploy to ECS (rolling; skipped until the service exists)
        run: |
          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" = "ACTIVE" ]; then
            aws ecs update-service --cluster "$CLUSTER" --service "$APP" --force-new-deployment >/dev/null
            aws ecs wait services-stable --cluster "$CLUSTER" --services "$APP"
            echo "deployed $APP"
          else
            echo "ECS service $APP not created yet — image is in ECR, skipping deploy"
          fi

      # Only when the release actually has one. Skipping the task entirely is not
      # an optimisation — a `post` run against a database with a pending `pre`
      # migration BLOCKS by design, so running it every time would turn a normal
      # release into a red deploy.
      # Skipped entirely on the cutover path: the `all` run above already applied
      # these, so a `post` here would find nothing — and running it would only
      # add a way for a green cutover to end on a red step.
      - name: Migrate (post) — after the new image is live
        if: >-
          steps.ecs.outputs.status == 'ACTIVE'
          && steps.ecs.outputs.phase_mode != 'all'
          && steps.phases.outputs.has_post == 'true'
        run: |
          .github/scripts/run-migration-task.sh post
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}
