# AWS deploy workflow for the Mercaria API.
# Builds the linux/arm64 backend image, pushes it to ECR, applies the database
# migrations as ECS one-shot tasks, and forces a new ECS deployment. AWS access
# is via the OIDC role oxy-github-deploy — no stored keys.
#
# The infrastructure is PROVISIONED AND SERVING (verified 2026-08-08): service
# `mercaria` on cluster `oxy-cluster`, ECR repo `oxy/mercaria`, target group
# `oxy-mercaria` behind the shared ALB, and the SSM parameters under
# /oxy/mercaria that the task definition reads as secrets. It all lives in
# oxy-infra (terraform-uswest2/), which stays the source of truth for changing
# any of it — this workflow only deploys onto it.
#
# The service-existence guard below is therefore a GUARD, not the normal path:
# it finds the service ACTIVE on every ordinary run, and only short-circuits
# (image pushed to ECR, deploy and migrations skipped) if the service is ever
# torn down or renamed. A run that reports no active service means the
# infrastructure moved, not that Mercaria is still awaiting its first
# provisioning.
#
# It guards against an ABSENT SERVICE and nothing else (#608). A
# `describe-services` call that FAILS — throttled, expired credential, network
# blip, missing cluster — is now a red run rather than a green no-op, because
# those are different facts and only one of them is a reason to ship nothing.
# And this run STATES what it did, in the four `Outcome:` steps at the end of
# the deploy job, so `deploy-coverage.yml` reads a statement instead of
# inferring "shipped" from a conclusion that cannot carry it.
#
# Migrations normally run as the pre/post one-shot pair around the rollout. Use
# `migration_phase=all` from workflow_dispatch only for a from-zero batch, where
# the whole journal has to be applied in one run before anything serves it — see
# the note on that step for why the pre/post pair cannot do it.
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      migration_phase:
        description: >-
          How to apply migrations. `pre-post` (default) applies the additive ones
          before the rollout and the destructive ones after. `all` applies
          everything in ONE run before the rollout — what a from-zero batch needs,
          and wrong for anything else.
        type: choice
        default: pre-post
        options:
          - pre-post
          - all

# `@oxyhq/db`'s migrator takes NO lock against a second concurrent migrator, and
# says so in its own runner: drizzle reads the ledger's high-water mark OUTSIDE
# its transaction, so two runs both read the same mark and both attempt the same
# DDL. The runner explicitly assigns the interlock to the caller, naming this
# exact case — "a deploy's own migration step racing a manually dispatched one".
# Measured in a sibling repo: the loser exits 1 on an already-applied statement
# while the ledger ends CORRECT (one row, no duplicates), so the cost is a red
# deploy that has already pushed its image and never reaches the rollout — not a
# damaged database. Mercaria is the only Oxy backend that was still missing this.
#
# `cancel-in-progress` is deliberately FALSE, and it reads like an optimisation
# to flip. It is the opposite. Cancelling between `run-task` and its exit-code
# check ORPHANS a live migration task and reports nothing; and cancellation does
# not prevent this workflow family's defensive rollback — it TRIGGERS it, which
# was measured in Allo on 2026-08-09 while trying to stop one.
#
# It is ALSO what bounds the `gate` job's runner occupancy, which is the question
# `docs/deploy.md` §"What to do when a gate times out" trains a reader to ask of
# any polling gate. The three web deploys each cancel their own superseded runs
# and can still have three gates polling at once; this group serialises instead,
# so at most ONE run of this workflow is in progress per ref and therefore at
# most one API gate ever polls. A queued run holds no runner at all. Net, this
# workflow now occupies LESS: a poll loop replaced a full duplicate run of the
# backend suite plus a PostGIS service container, on every push to `main`.
#
# THE COST OF THIS SETTING, AND WHAT NOW BOUNDS IT (#574). One group with
# `cancel-in-progress: false` gives a queue depth of ONE, so a third arrival
# EVICTS the queued second. The evicted run executes nothing — no rollout and no
# migration — and reports it to nobody.
#
# That is survivable and is NOT fixed by changing this block. Per-sha groups (the
# `ci.yml` shape) would let two runs migrate CONCURRENTLY, which the note at the
# top of this comment says the migrator cannot take; and the fact that would let
# an eviction decision spare a migration-carrying run is only readable after
# checkout, which is after the eviction has already happened.
#
# It is survivable because the evictor is always a DESCENDANT: it ships a
# superset of the code, and the post step below applies whatever the ledger says
# is pending, so it carries the evicted run's migrations too. That holds exactly
# while the evictor SUCCEEDS — which nothing asserted, and which is now
# `deploy-coverage.yml`'s job.
concurrency:
  group: deploy-aws-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: mercaria
  CLUSTER: oxy-cluster
  DOCKERFILE: Dockerfile
  # The PostgreSQL database the migration tasks below are allowed to touch.
  #
  # NOT cosmetic: the migrator refuses to run unless this matches the database its
  # DATABASE_URL actually resolves to, so a value that disagrees with the
  # provisioned database fails the deploy loudly instead of migrating some other
  # one.
  #
  # VERIFIED, not assumed: provisioned 2026-08-08 via oxy-infra runbook 30 — role
  # `mercaria` owns database `mercaria` on oxy-postgres, with PostGIS installed by
  # oxyadmin (it is not a trusted extension, so database ownership alone cannot
  # install it). The matching DATABASE_URL is already live: GitHub secret → SSM
  # /oxy/mercaria/DATABASE_URL → task definition oxy-mercaria:2.
  PG_DATABASE: mercaria

jobs:
  # WHAT IS VERIFIED BEFORE THE API SHIPS: the whole of `ci.yml` — the ten
  # `validate:*` guards, five typechecks, the three app test runners, the API
  # suite and the four build jobs — asserted for THIS commit.
  #
  # This job REPLACED a `test` job that ran a partial copy of `ci.yml`, and the
  # copy is why the gap existed rather than a reason to keep it. Measured on
  # `main` by parsing both workflows (#518): the copy ran 4 steps where
  # `ci.yml`'s `Lint & Test` ran 21, and the missing 18 included every
  # `validate:*` guard and every typecheck. So the API deploy LOOKED gated —
  # `needs: test` is visible — while shipping things CI rejected on the same
  # push.
  #
  # The consequence was demonstrated, not reasoned. Appending
  # `export const X: number = PRODUCTION_ORIGINS[0];` to
  # `packages/backend/src/lib/allowed-origins.ts` on 7071d999:
  #
  #   bun run --filter @mercaria/backend typecheck  -> exit 2, TS2322   (NOT in the copy)
  #   bun run --filter @mercaria/backend test       -> 82 tests passed  (in the copy)
  #   bun run build:backend                         -> exit 0           (in the copy)
  #
  # and the mutated symbol appeared TWICE in `packages/backend/dist/index.js`,
  # the artifact this workflow bakes into the ECS image. `build:backend` is
  # esbuild and vitest transpiles rather than typechecks, so nothing the old
  # gate ran could see it.
  #
  # Widening the copy to 21 steps was the WRONG repair: it leaves two lists to
  # keep in sync, which is exactly how it got here. Reading the real run keeps
  # ONE definition of "did CI pass".
  #
  # THE POSTGIS SERVICE CONTAINER WENT WITH THE COPY, deliberately. This job
  # runs one `fetch` loop and needs no database; the container, its image pin and
  # the x86-runner constraint that container imposes now live in exactly one
  # place, on `ci.yml`'s `lint-and-test` job, which is the job that still needs
  # them. Nothing else in this workflow read it — `deploy` takes no output from
  # the job it `needs:` and touches no Postgres.
  gate:
    name: CI passed for this commit
    runs-on: ubuntu-latest
    # Above the script's own 30-minute wait for a run to conclude, so a genuine
    # refusal is reported by the script with its reason rather than by the runner
    # killing the job. See `docs/deploy.md` §"What to do when a gate times out"
    # before raising it — a timeout here is runner occupancy, not an impatient
    # budget.
    timeout-minutes: 40
    # Job-level, which REPLACES the workflow-level block for this job rather than
    # adding to it. That is the point: the gate needs `actions: read` to ask what
    # `ci.yml` concluded, and it must NOT hold `id-token: write` — a poll loop has
    # no business being able to assume the AWS deploy role.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
      - name: Require a green CI run for this commit
        run: node .github/scripts/require-ci-success.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: gate
    # Native arm64, matching the image this job builds.
    #
    # A CORRECTED RECORD, written down so the wrong version is not re-derived:
    # on 2026-08-08 every run of this workflow completed as `action_required`
    # with ZERO jobs, and this ARM label was blamed for it. It was not the label.
    # GitHub's run page gives the real reason — "GitHub detected that this
    # workflow file may be malicious. It will not run until someone with write
    # access approves it" — which is why a dispatch also produced zero jobs and
    # why the API's approve endpoint refuses (it only serves fork PRs). Two
    # measurements settle it: the first green deploy (run 31275312983) started
    # 20:05:05Z once approved and ran THIS job on THIS label, three minutes
    # before the commit that switched it to QEMU; and Syra's identical workflow
    # was blocked the same way with both jobs already on `ubuntu-latest`.
    # Emulated arm64 is much slower than native, so the label stays; a blocked
    # run needs a human to approve it, not a runner change.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # An EXPLICIT allowlist — never `toJSON(secrets)`.
      #
      # This step used to enumerate every secret the repo can see and pipe the
      # lot through `jq` into `aws ssm put-parameter`. That shape is
      # indistinguishable from a secret-exfiltration payload, and GitHub's
      # malicious-workflow detection matches it: every run was then created as
      # `action_required` with ZERO jobs — no environment protection, nothing to
      # approve in `pending_deployments` — waiting for a human to press "Approve
      # and run" in the UI. Measured across the org on 2026-08-08: the three
      # repos whose deploy workflow contained `toJSON(secrets)` (Mercaria, Syra,
      # Homiio) were all held, and the two without it (Mention, OxyHQServices)
      # deployed unheld. The gate re-fires whenever the workflow file changes,
      # which is why it looked like it "started" on a particular day here — this
      # file had just been edited. That red herring already cost one wrong
      # diagnosis, recorded on the `deploy` job's `runs-on` above.
      #
      # So the allowlist is not tidiness: it is the property that keeps
      # automated deploys running at all. `src/db/__tests__/deployWorkflow.test.ts`
      # fails if `toJSON(secrets)` comes back.
      #
      # The SYNC_ prefix is load-bearing for a second, unrelated reason. The OIDC
      # step above exports AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY into the job
      # environment, so binding a secret to an env var under its raw name would
      # shadow the assumed role and fail this step with
      # UnrecognizedClientException. The old loop never bound a secret to an env
      # var at all, which is how it sidestepped that; an allowlist has to avoid
      # it deliberately. Same reason oxy-api's sync step carries the prefix.
      - name: Sync GitHub secrets -> SSM (GitHub is the source of truth)
        env:
          SYNC_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SYNC_REDIS_URL: ${{ secrets.REDIS_URL }}
          SYNC_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SYNC_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          SYNC_VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SYNC_SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SYNC_SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SYNC_CONNECTOR_ENCRYPTION_KEY: ${{ secrets.CONNECTOR_ENCRYPTION_KEY }}
          SYNC_CONNECTOR_OAUTH_STATE_SECRET: ${{ secrets.CONNECTOR_OAUTH_STATE_SECRET }}
          SYNC_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          SYNC_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SYNC_STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
          SYNC_STRIPE_ONBOARDING_STATE_SECRET: ${{ secrets.STRIPE_ONBOARDING_STATE_SECRET }}
        run: |
          # WHAT THIS REPO OWNS AND CONSUMES — deliberately NOT a mirror of the
          # live task definition, in BOTH directions.
          #
          # It is SHORTER by SERVICE_SECRET, which oxy-mercaria:3 still names and
          # which nothing here reads any more (see below). It is LONGER by the
          # four connector parameters, which nothing names YET: measured on
          # oxy-mercaria:3 on 2026-08-16, the live revision reads exactly
          # SERVICE_SECRET, the three VAPID_*, REDIS_URL, the two AWS_* and
          # DATABASE_URL.
          #
          # That direction is the SAFE one and the order is the whole point. A
          # task definition naming an SSM parameter that does not exist fails at
          # task START with ResourceInitializationError — on the next scale-up or
          # deploy rather than immediately — so the parameter has to be written
          # BEFORE anything reads it. Syncing a value nothing consumes is inert;
          # naming a value nothing wrote is an outage. So:
          #
          #   1. (this PR) the four land in /oxy/mercaria/ on the next deploy and
          #      NOTHING reads them. Nothing can fail.
          #   2. (oxy-infra) add the four to Mercaria's task definition in
          #      terraform-uswest2/app-services.tf, apply, roll out. Only now does
          #      the container read them, and by then they exist.
          #
          # The consumers are in this repo already: SHOPIFY_CLIENT_ID and
          # SHOPIFY_CLIENT_SECRET in connectors/shopify/config.ts,
          # CONNECTOR_OAUTH_STATE_SECRET in connectors/config.ts, and
          # CONNECTOR_ENCRYPTION_KEY in lib/connector-crypto.ts.
          #
          # CONNECTOR_OAUTH_REDIRECT_BASE_URL and CONNECTOR_DEFAULT_CATEGORY_SLUG
          # are deliberately ABSENT: they are configuration, not secrets, and land
          # as plain `environment` entries in the task definition — oxy-infra's
          # half. Adding them here would write a public URL into SecureString and
          # give the deployment two places to change it.
          #
          # SERVICE_SECRET is RETIRED (#164). No code reads it: the middleware
          # that did is deleted, and it had no mounted route before that. It is
          # off this list so a deploy stops re-writing a live credential nothing
          # consumes — which is a narrower change than it looks, and the order
          # is what keeps it safe:
          #
          #   1. (this PR) the app stops reading it and the sync stops writing
          #      it. /oxy/mercaria/SERVICE_SECRET KEEPS its current value and
          #      oxy-mercaria:3 keeps injecting it into an env var nobody reads.
          #      Nothing can fail.
          #   2. (oxy-infra) drop the SERVICE_SECRET entry from Mercaria's task
          #      definition in terraform-uswest2/app-services.tf, apply, roll
          #      out. Only now does the container stop naming the parameter.
          #   3. (after that rollout) delete the SSM parameter and the GitHub
          #      repo secret, and rotate the value anywhere else it was pasted.
          #
          # Doing 3 before 2 is an OUTAGE, not a cleanup: a task definition that
          # names a parameter which no longer exists fails at task START with
          # ResourceInitializationError, and it fails on the next scale-up or
          # deploy rather than immediately, so the tasks running now keep
          # serving while the deployment that discovers it looks unrelated.
          #
          # Do NOT re-add SERVICE_SECRET here to "match the live task
          # definition" — until step 2 lands, the live task definition naming it
          # is exactly the state being retired. src/db/__tests__/deployWorkflow.test.ts
          # pins this list.
          # The four STRIPE_* names are the payment rail's secret half (#35).
          # `STRIPE_ENABLED` and every URL, country and currency list beside it
          # are plain CONFIGURATION and belong in the task definition's
          # `environment`, not here — and so does STRIPE_PUBLISHABLE_KEY, which
          # is `pk_live_…`: the checkout handoff serves it to every browser
          # (`services/payments/checkout-payment.service.ts:240`), so storing it
          # as a SecureString would only make it harder to read, never safer.
          #
          # `config/index.ts:571` refuses to arm the rail unless the secret key
          # and BOTH webhook secrets are present, so these four land or the rail
          # stays off — there is no half-configured state to leak through.
          #
          # STRIPE_WEBHOOK_SECRET_PREVIOUS and its connect twin are deliberately
          # ABSENT. They exist only inside a rotation window, and a name on this
          # list with no value behind it warns on EVERY deploy forever, which is
          # how a real warning stops being read. A rotation adds the name here
          # AND to the task definition in the same pair of PRs, in that order,
          # and removes both when the window closes.
          SHARED_SECRETS="REDIS_URL"
          APP_SECRETS="DATABASE_URL VAPID_PRIVATE_KEY VAPID_PUBLIC_KEY VAPID_SUBJECT SHOPIFY_CLIENT_ID SHOPIFY_CLIENT_SECRET CONNECTOR_ENCRYPTION_KEY CONNECTOR_OAUTH_STATE_SECRET STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_CONNECT_WEBHOOK_SECRET STRIPE_ONBOARDING_STATE_SECRET"

          # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are deliberately absent,
          # though oxy-mercaria:3 reads both from /oxy/_shared/. Mercaria
          # CONSUMES those two; it does not own them — the repos that hold them
          # as secrets (OxyHQServices, Syra) are what write them. This repo holds
          # neither, so leaving them out stops nothing that was being synced, and
          # a key added here later would otherwise overwrite the shared
          # credential every other backend reads.
          #
          # REDIS_URL is in the same position today — unset here, so it warns and
          # leaves /oxy/_shared/REDIS_URL alone on every run, the same no-op the
          # old loop performed silently. It stays on the list because it is the
          # one shared parameter this repo could legitimately come to own, and
          # the endpoint guard below is what would make setting it safe.
          for k in $SHARED_SECRETS $APP_SECRETS; do
            v=$(printenv "SYNC_$k" || true)
            # A secret left empty, or set to a single dash, is a mistake — not an
            # instruction to overwrite production with garbage. Skipping the sync
            # preserves whatever SSM already holds.
            if [ -z "$v" ] || [ "$v" = "-" ]; then
              echo "::warning::skip empty/placeholder secret $k; SSM unchanged"
              continue
            fi
            if [ "$k" = "REDIS_URL" ] && ! printf '%s' "$v" | grep -q '\.usw2\.cache\.amazonaws\.com'; then
              echo "::warning::skip REDIS_URL because it does not point at the us-west-2 Valkey endpoint; SSM unchanged"
              continue
            fi
            case " $SHARED_SECRETS " in *" $k "*) path="/oxy/_shared/$k";; *) path="/oxy/$APP/$k";; esac
            aws ssm put-parameter --name "$path" --value "$v" --type SecureString --overwrite >/dev/null && echo "synced -> $path"
          done

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (linux/arm64)
        id: image
        run: |
          IMG=$ECR_REGISTRY/oxy/$APP
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            -f "$DOCKERFILE" \
            -t "$IMG:${{ github.sha }}" \
            -t "$IMG:latest" \
            --push \
            .
          DIGEST=$(aws ecr describe-images \
            --repository-name "oxy/$APP" \
            --image-ids "imageTag=$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::ECR returned an invalid image digest: $DIGEST"
            exit 1
          fi
          IMAGE_URI="$IMG@$DIGEST"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "built immutable image $IMAGE_URI"

      # ── Migrations run as one-shot ECS tasks, around the rollout ─────────────
      #
      # Two phases, and the split is the whole point (see @oxyhq/db's phases.ts):
      # `pre` is additive and safe while the OLD image still serves, so it runs
      # BEFORE the service update; `post` drops and narrows, which would 500 the
      # old image, so it runs AFTER the new one is live. Every migration file
      # declares its own side, and the migrator refuses to guess for one that
      # does not.
      #
      # Register one task revision pinned to the digest built above. Migrations,
      # the rollout and catalog registration all use that same revision, so the
      # database, registry and serving service cannot silently consume different
      # contents through a mutable tag.
      - name: Resolve the ECS one-shot shape
        id: ecs
        env:
          # Absent on a `push` trigger, where only the default is ever right.
          REQUESTED_PHASE: ${{ github.event.inputs.migration_phase }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          echo "phase_mode=${REQUESTED_PHASE:-pre-post}" >> "$GITHUB_OUTPUT"
          # A FAILED QUERY AND AN ABSENT SERVICE ARE DIFFERENT FACTS (#608).
          #
          # This used to read `... 2>/dev/null || echo NONE`, which collapsed
          # them into one sentinel: a throttled call, an expired credential or a
          # network blip became "no service", every downstream step skipped, and
          # the run concluded SUCCESS having shipped nothing. Measured against
          # the real account on 2026-08-18 (us-west-2, oxy-cluster):
          #
          #   service mercaria ACTIVE          -> exit 0, "ACTIVE"
          #   service absent, cluster present  -> exit 0, "None"   <- the guard
          #   cluster absent                   -> exit 254 (ClusterNotFoundException)
          #   invalid credential               -> exit 254 (UnrecognizedClientException)
          #   endpoint unreachable             -> exit 255
          #
          # So the discriminator is the EXIT CODE and `|| echo NONE` is exactly
          # what destroyed it — note the literal `NONE` was never even produced
          # by the guard path, which prints `None`; the sentinel was reachable
          # only when the query had failed.
          #
          # The guard is preserved verbatim: a query that SUCCEEDS and reports no
          # active service still short-circuits, pushes the image and skips the
          # rest. A query that FAILS is now red, because the cheapest green must
          # not be "let one AWS call fail and ship nothing". Every other `aws`
          # call in this step already fails the job under `set -e`; this one was
          # the exception.
          if ! STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text); then
            echo "::error title=ECS query failed::aws ecs describe-services exited non-zero for service $APP on cluster $CLUSTER. This is NOT the service-existence guard — an absent service exits 0 and reports None. Re-run this deploy; nothing was migrated or rolled out."
            exit 1
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP reported status '$STATUS' — the query SUCCEEDED and found no active service, so there is nothing to migrate or deploy against"
            exit 0
          fi

          # Oxy provisions this service identity directly into SSM. Refuse to
          # register a release revision unless both halves exist; ECS resolves
          # these references before the container starts.
          for PARAMETER in OXY_APPLICATION_KEY OXY_APPLICATION_SECRET; do
            aws ssm get-parameter \
              --name "/oxy/$APP/$PARAMETER" \
              --query 'Parameter.Name' --output text >/dev/null
          done

          TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].taskDefinition' --output text)
          echo "previous_task_definition=$TD" >> "$GITHUB_OUTPUT"
          NET=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].networkConfiguration' --output json)
          DEFINITION=$(aws ecs describe-task-definition --task-definition "$TD" --query taskDefinition --output json)
          CONTAINER=$(jq -er '.containerDefinitions[0].name' <<<"$DEFINITION")
          MATCHES=$(jq --arg name "$CONTAINER" '[.containerDefinitions[] | select(.name == $name)] | length' <<<"$DEFINITION")
          if [ "$MATCHES" != "1" ]; then
            echo "::error::expected exactly one ECS container named $CONTAINER; found $MATCHES"
            exit 1
          fi
          PAYLOAD=$(jq \
            --arg name "$CONTAINER" \
            --arg image "$IMAGE_URI" \
            --arg oxy_api_url "https://api.oxy.so" \
            --arg oxy_key "arn:aws:ssm:$AWS_REGION:237343248947:parameter/oxy/$APP/OXY_APPLICATION_KEY" \
            --arg oxy_secret "arn:aws:ssm:$AWS_REGION:237343248947:parameter/oxy/$APP/OXY_APPLICATION_SECRET" \
            '{family, taskRoleArn, executionRoleArn, networkMode,
              containerDefinitions, volumes, placementConstraints,
              requiresCompatibilities, cpu, memory, tags, pidMode, ipcMode,
              proxyConfiguration, inferenceAccelerators, ephemeralStorage,
              runtimePlatform, enableFaultInjection}
             | with_entries(select(.value != null))
             | .containerDefinitions |= map(
                 if .name == $name then
                   .image = $image
                   | .environment = (
                       ((.environment // []) | map(select(.name != "OXY_API_URL")))
                       + [{name: "OXY_API_URL", value: $oxy_api_url}]
                     )
                   | .secrets = (
                       ((.secrets // []) | map(select(
                         .name != "OXY_APPLICATION_KEY" and
                         .name != "OXY_APPLICATION_SECRET"
                       ))) + [
                         {name: "OXY_APPLICATION_KEY", valueFrom: $oxy_key},
                         {name: "OXY_APPLICATION_SECRET", valueFrom: $oxy_secret}
                       ]
                     )
                 else . end
               )' \
            <<<"$DEFINITION")
          IMMUTABLE_TD=$(aws ecs register-task-definition \
            --cli-input-json "$PAYLOAD" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "task_definition=$IMMUTABLE_TD" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          # JSON on one line: a GITHUB_OUTPUT value cannot span lines unhelped.
          echo "network=$(echo "$NET" | jq -c .)" >> "$GITHUB_OUTPUT"

      # Does the JOURNAL contain a post-rollout migration? Grepped with the
      # pattern @oxyhq/db EXPORTS (`POST_PHASE_GREP_PATTERN`), never a copy —
      # `src/db/__tests__/deployWorkflow.test.ts` asserts this workflow contains
      # that exact string, so the two cannot drift. The grep is sound only
      # because the migrator separately proves every file carries exactly one
      # well-formed marker; without that a typo would read as "no post migration"
      # and the drop would never be applied by anything.
      #
      # THE SCOPE IS THE WHOLE MIGRATIONS DIRECTORY, NOT THIS RELEASE'S DIFF, and
      # that is load-bearing rather than sloppy — it used to be described here as
      # "this release", which is what invited narrowing it.
      #
      # Read literally, `has_post` is `true` whenever the repository contains ANY
      # post-phase migration. Eleven do, and one has since 0046e27a on
      # 2026-08-08 — which landed BEFORE this step was written — so this output
      # has been `true` on every evaluation it has ever made, and the `if:` below
      # has never once skipped the task.
      #
      # Which is the correct behaviour and the reason not to "fix" it. Migrations
      # are CUMULATIVE: the migrator applies whatever the ledger says is pending,
      # not whatever this commit added. So running the post task unconditionally
      # is what makes a deploy that never happened recoverable by the next one —
      # #574's evicted run carrying `0106_panoramic_patch` was applied four
      # minutes later by `f38227b7`, a commit that added no migration at all.
      # Narrowing this grep to the release's own diff (a `git diff` against the
      # previous deploy, say) would read as tightening and would silently DELETE
      # that recovery, turning a bounded window into a permanent one. A guard in
      # `deployWorkflow.test.ts` fails the build if the scope is narrowed.
      - name: Detect a post-rollout migration in the journal
        id: phases
        run: |
          if grep -rlE '^-- oxy:deploy-phase=post$' packages/backend/drizzle >/dev/null 2>&1; then
            echo "has_post=true" >> "$GITHUB_OUTPUT"
            echo "this release carries at least one post-rollout migration"
          else
            echo "has_post=false" >> "$GITHUB_OUTPUT"
            echo "no post-rollout migration in this release"
          fi

      # The CUTOVER path, chosen by hand from workflow_dispatch. One `all` run
      # applies the whole chain in journal order before the rollout, which the
      # pre/post pair cannot do: a `pre` migration queued behind an unapplied
      # `post` one BLOCKS by design, and the journal in packages/backend/drizzle
      # has exactly that shape. It is safe only on a database no image is serving
      # yet — which is also why it must never be the default. Measured: on an
      # empty database `--phase=pre` refuses and names both files, while `all`
      # applies all of them and leaves both later phases clean no-ops.
      - name: Migrate (all) — cutover only, never a normal release
        id: migrate_all
        if: steps.ecs.outputs.status == 'ACTIVE' && steps.ecs.outputs.phase_mode == 'all'
        run: |
          .github/scripts/run-migration-task.sh all
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      - name: Migrate (pre) — before the rollout
        id: migrate_pre
        if: steps.ecs.outputs.status == 'ACTIVE' && steps.ecs.outputs.phase_mode != 'all'
        run: |
          .github/scripts/run-migration-task.sh pre
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      # ONE authority for "does the service exist", and it is the Resolve step
      # above (#608).
      #
      # This step used to re-query ECS through a SECOND `|| echo NONE`, with its
      # own independent failure mode — and it had no `if:`, so whatever its shell
      # decided it always reported `success`. That produced the worst of the
      # three states this workflow can end in: `Migrate (pre)` ran, so the
      # DATABASE moved forward, while the rollout was silently skipped and the
      # PREVIOUS image kept serving. Two queries for one fact are two
      # representations that can disagree, and this is what disagreeing cost.
      #
      # Gating on the resolved output instead makes the step report `skipped`
      # when the service is absent, which is what lets the outcome below be a
      # statement rather than a guess.
      - name: Deploy to ECS (rolling)
        id: rollout
        if: steps.ecs.outputs.status == 'ACTIVE'
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          update_json=$(aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$APP" \
            --task-definition "$TASK_DEFINITION")
          echo "deployment_started=true" >> "$GITHUB_OUTPUT"
          deployment_id=$(jq -r --arg task_definition "$TASK_DEFINITION" \
            '[
              .service.deployments[]
              | select(.status == "PRIMARY" and .taskDefinition == $task_definition)
            ] | if length == 1 then .[0].id else "" end' \
            <<<"$update_json")
          if [ -z "$deployment_id" ]; then
            echo "::error::ECS returned no primary deployment for $TASK_DEFINITION"
            exit 1
          fi

          bash .github/scripts/wait-for-ecs-deployment.sh "$CLUSTER" "$APP" "$deployment_id"

          service_json=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --output json)
          live_task_definition=$(jq -r '.services[0].taskDefinition' <<<"$service_json")
          if [ "$live_task_definition" != "$TASK_DEFINITION" ]; then
            echo "::error::ECS serves $live_task_definition instead of $TASK_DEFINITION"
            exit 1
          fi
          live_image=$(aws ecs describe-task-definition \
            --task-definition "$live_task_definition" \
            --query "taskDefinition.containerDefinitions[?name=='$CONTAINER_NAME'].image | [0]" \
            --output text)
          if [ "$live_image" != "$IMAGE_URI" ]; then
            echo "::error::ECS serves $live_image instead of $IMAGE_URI"
            exit 1
          fi

          echo "performed=true" >> "$GITHUB_OUTPUT"
          echo "deployed $APP as $live_task_definition ($live_image)"

      - name: Verify live Mercaria MCP and central OAuth contract
        id: mcp_smoke
        if: steps.rollout.outputs.performed == 'true'
        run: |
          set +e
          bash .github/scripts/smoke-mcp.sh
          smoke_status=$?
          external_dependency_exit=42
          echo "status=$smoke_status" >> "$GITHUB_OUTPUT"
          if [ "$smoke_status" = "$external_dependency_exit" ]; then
            echo "rollback_safe=false" >> "$GITHUB_OUTPUT"
          else
            echo "rollback_safe=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$smoke_status"

      # Only additive `pre` migrations have run when this step is reached. A
      # failed candidate can therefore return to the exact previous revision.
      # The manually selected `all` cutover is excluded because it may already
      # have applied destructive migrations before the rollout. A central Oxy
      # outage is excluded too: changing Mercaria revisions cannot repair it.
      - name: Roll back a failed candidate before post migration
        if: >-
          ${{
            failure() &&
            steps.ecs.outputs.phase_mode != 'all' &&
            steps.rollout.outputs.deployment_started == 'true' &&
            steps.mcp_smoke.outputs.rollback_safe != 'false'
          }}
        env:
          PREVIOUS_TASK_DEFINITION: ${{ steps.ecs.outputs.previous_task_definition }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS_TASK_DEFINITION" ]; then
            echo "::error::No previous task definition was recorded for rollback"
            exit 1
          fi

          rollback_json=$(aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$APP" \
            --task-definition "$PREVIOUS_TASK_DEFINITION")
          rollback_deployment_id=$(jq -r --arg task_definition "$PREVIOUS_TASK_DEFINITION" \
            '[
              .service.deployments[]
              | select(.status == "PRIMARY" and .taskDefinition == $task_definition)
            ] | if length == 1 then .[0].id else "" end' \
            <<<"$rollback_json")
          if [ -z "$rollback_deployment_id" ]; then
            echo "::error::ECS returned no primary rollback deployment for $PREVIOUS_TASK_DEFINITION"
            exit 1
          fi

          bash .github/scripts/wait-for-ecs-deployment.sh \
            "$CLUSTER" "$APP" "$rollback_deployment_id"
          live_task_definition=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$APP" \
            --query 'services[0].taskDefinition' \
            --output text)
          if [ "$live_task_definition" != "$PREVIOUS_TASK_DEFINITION" ]; then
            echo "::error::Rollback left $live_task_definition live instead of $PREVIOUS_TASK_DEFINITION"
            exit 1
          fi

          bash .github/scripts/smoke-mcp.sh
          echo "Rolled back to $PREVIOUS_TASK_DEFINITION before post migrations or catalog publication"

      # Runs on every ordinary release, because `has_post` is true whenever the
      # journal holds a post migration at all (see the Detect step). That is
      # deliberate: it applies whatever the ledger says is PENDING, so a deploy
      # that was evicted from the queue is made good by the next one instead of
      # by luck. The `if:` guards the two states where the task would be wrong
      # rather than merely redundant.
      #
      # The `pre` step above ran in THIS job, moments ago, so there is no pending
      # `pre` migration for this to block behind — which is the condition that
      # would turn a normal release red.
      #
      # Skipped entirely on the cutover path: the `all` run above already applied
      # these, so a `post` here would find nothing — and running it would only
      # add a way for a green cutover to end on a red step.
      - name: Migrate (post) — after the new image is live
        if: >-
          steps.ecs.outputs.status == 'ACTIVE'
          && steps.ecs.outputs.phase_mode != 'all'
          && steps.phases.outputs.has_post == 'true'
        run: |
          .github/scripts/run-migration-task.sh post
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      - name: Register the deployed capability catalog
        if: steps.ecs.outputs.status == 'ACTIVE'
        run: |
          COMMAND_JSON='["node","packages/backend/dist/register-capability-catalog.js"]' \
          TASK_LABEL='capability catalog registration' \
          STARTED_BY='deploy-capability-catalog' \
          .github/scripts/run-ecs-task.sh
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      # ── The run STATES ITS OWN OUTCOME ──────────────────────────────────────
      #
      # #608: `deploy-coverage.yml` asserts that the newest run of this workflow
      # concluded `success` and reports the commit as SHIPPED. A run that
      # short-circuited concludes `success` too, so "shipped" was being inferred
      # from a conclusion that cannot carry it.
      #
      # The four steps below are the statement, and they are read by
      # `.github/scripts/require-deploy-coverage.mjs` through
      # `/actions/runs/{id}/jobs` — the ONLY machine-readable channel there is.
      # A job `outputs:` block is not returned by that endpoint at all, and a
      # step summary has no REST representation, so neither could be read by
      # anything; the step NAME is what the API carries. The names are pinned
      # against the script's `DEPLOY_OUTCOME_STEPS` by `deployCoverage.test.ts`,
      # so renaming one here fails the build rather than silently making the
      # coverage check unable to find it.
      #
      # Each pair is EXHAUSTIVE and MUTUALLY EXCLUSIVE by construction — the two
      # conditions are one predicate and its negation — so exactly one member of
      # each runs whenever the job reaches them, and the reader asserts exactly
      # that. "Neither ran" and "both ran" are therefore states the check
      # refuses rather than states it has to interpret. Silence is not a valid
      # outcome.
      #
      # No `always()`, deliberately. If an earlier step FAILED the job, the run
      # does not conclude `success` and `judgeCoverage` already reports the
      # commit as unshipped — a statement composed after a failure would be a
      # second, weaker answer to a question already answered.
      #
      # The step summary lines are for the human reading the run page. They are
      # not what the check reads, and nothing may come to depend on them being
      # there: the API does not expose them.
      - name: 'Outcome: migrations applied'
        if: steps.migrate_all.outcome == 'success' || steps.migrate_pre.outcome == 'success'
        run: |
          echo "the pre-rollout migration task ran and exited 0"
          echo '- **migrations applied**: the pre-rollout migration task ran and exited 0.' >> "$GITHUB_STEP_SUMMARY"

      - name: 'Outcome: migrations NOT applied'
        if: steps.migrate_all.outcome != 'success' && steps.migrate_pre.outcome != 'success'
        run: |
          echo "no pre-rollout migration task ran — this run did not touch the database"
          echo '- **migrations NOT applied**: no pre-rollout migration task ran; this run did not touch the database.' >> "$GITHUB_STEP_SUMMARY"

      - name: 'Outcome: rollout performed'
        if: steps.rollout.outputs.performed == 'true'
        run: |
          echo "the ECS service was updated and reached a stable state on the new image"
          echo '- **rollout performed**: the ECS service was updated and reached a stable state on the new image.' >> "$GITHUB_STEP_SUMMARY"

      - name: 'Outcome: rollout NOT performed'
        if: steps.rollout.outputs.performed != 'true'
        run: |
          echo "no rollout happened — the image is in ECR and is NOT being served"
          echo '- **rollout NOT performed**: the image is in ECR and is NOT being served.' >> "$GITHUB_STEP_SUMMARY"
