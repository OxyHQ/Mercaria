name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# On a topic branch, superseding a run is right: only the tip needs a verdict.
# On `main` it is the opposite, and the three web deploys now depend on the
# difference. Every commit on `main` is a commit production serves, so it needs
# its OWN verdict — and with the group keyed on the ref alone, back-to-back
# merges cancelled the run for the commit that had just landed. Measured over
# the last 329 pushes to `main`: 52 CI runs concluded `cancelled`, and 64 web
# deploys shipped from those commits with no test signal of any kind. That is
# more than twice the 29 that shipped from an outright `failure`.
#
# The sha goes in the GROUP rather than `cancel-in-progress` going false,
# because false SERIALISES: with one shared group a burst of merges would queue,
# and the last commit's deploy would wait out every earlier run. A per-sha group
# has nothing to cancel and nothing to queue behind, so `main` runs go in
# parallel. The cost is more concurrent jobs during a burst, which queue against
# the account's concurrency limit and resolve themselves — where a cancellation
# never resolves itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    # x86, and it must stay x86 even though the API image `deploy-aws.yml` ships
    # is `linux/arm64`. TWO independent things force it, and fixing either one
    # alone still leaves the job broken:
    #
    #  1. GitHub-hosted ARM runners do not support service containers at all. A
    #     run that requests one dies before its first job with `action_required`
    #     and zero jobs (measured on runs 31263904439 / 31263963083).
    #  2. `postgis/postgis` publishes linux/amd64 ONLY — checked against the
    #     registry, where the tag's OCI index carries one platform entry plus an
    #     attestation. So the container below could not start on an ARM host
    #     regardless.
    #
    # Together those close the tempting repair: finding a multi-arch Postgres
    # image does NOT make an ARM runner workable, and neither does waiting for
    # ARM service-container support while this image stays amd64-only. Nothing
    # here is architecture-sensitive anyway.
    #
    # This note used to sit on `deploy-aws.yml`'s `test` job, which #518 deleted
    # as a drifted copy of this one. It moved rather than went, because the
    # constraint is imposed by the service container below and this is now the
    # only job in the repository that has one.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # The API suite needs a real PostGIS server: the `*.realdb.test.ts` files
      # run their SQL against a throwaway database the harness creates HERE
      # (see packages/backend/vitest.pg.globalSetup.ts).
      #
      # Pinned to the SAME image as docker-compose.postgres.yml, on BOTH versions.
      # A floating PostGIS minor is a floating set of function volatilities, and
      # the generated `geography` column requires `ST_MakePoint` and the
      # geometry→geography cast to be IMMUTABLE — so a developer's database and
      # CI's must not be able to disagree about what is installed.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: mercaria
          POSTGRES_PASSWORD: mercaria
          POSTGRES_DB: mercaria_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercaria -d mercaria_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs BEFORE lint and the typechecks, and needs neither: it reads the
      # tracked file listing, so it costs a couple of seconds and answers the
      # one question a green build cannot — whether Mongo came back. Mongo does
      # not return as a broken build; it returns as a dependency somebody
      # hoisted, and every other step here passes while it does.
      - name: Guard against MongoDB returning
        run: bun run validate:no-mongo

      # AGENTS.md is loaded into EVERY agent session, so its size is paid on
      # every task forever. It reached 478 KB by accretion — ~100 lines of
      # per-issue design notes appended by each feature PR, none of them wrong
      # on its own and none visible except in the sum. That is the shape a gate
      # catches and a convention does not. Costs a second; reads the tracked
      # file listing and nothing else.
      - name: Guard the AGENTS.md budget
        run: bun run validate:agents-md
      - name: Lint coverage is pinned (bun run lint covers 4 of 6 packages)
        run: bun run validate:lint-coverage

      # The storefront ships an Arabic bundle (#396) and mirrors its layout from
      # LOGICAL utilities (#397); #434 migrated the dashboard and POS to the same
      # utilities and widened the scan to all four client packages. A physical
      # `ml-2` or `left-4` half-mirrors the screen it lands on — the row order
      # flips while the padding does not — and nothing else here can see it: the
      # class is valid Tailwind, tsc is happy and the export succeeds.
      #
      # The same step also carries the DIRECTION half (#434), because the two are
      # one property: logical classes with no direction set mirror nothing, and a
      # direction set on a locale with no bundle mirrors an ENGLISH screen. That
      # second one is live — the dashboard and POS ship no `ar` yet — so the
      # guard asserts direction follows the SHIPPED BUNDLES rather than the
      # language tag. `packages/ui` — which owns the modules asserted — has no
      # test runner, and this guard compares all four packages' bundles against
      # one shared locale list, which no single app suite can see. (The three
      # Expo apps DO have runners: the `Test Dashboard`, `Test App` and `Test
      # POS` steps below.) Reads the tracked file listing and imports one
      # dependency-free module; costs a second.
      #
      # It also carries the SLIDING-PANEL half (#429). `Panel` and `SheetContent`
      # are the residual the class guard could not reach: a transform sign and a
      # divider edge are computed from the direction rather than spelled as
      # classes, because `translateX` is physical on both platforms and the
      # logical border utilities emit `borderInline*`, which RN 0.85.3 drops.
      # Arithmetic over a boolean fails by rendering perfectly from the wrong
      # edge, which typechecks and exports.
      - name: Guard RTL logical classes and layout direction
        run: bun run validate:rtl-classes

      # The companion to the step above, and the reason it is a separate one:
      # that guard reads CLASS NAMES out of the source, and bidi isolation is
      # not in the source, it is in the VALUE a formatter returns at runtime.
      # FSI/PDI are zero-width default-ignorable characters, so isolation that
      # was never applied, applied twice or applied with the wrong character
      # looks identical in every screenshot and every diff. This runs the real
      # `packages/ui` formatters and asserts their code points. Same reason as
      # above for living here: the modules are owned by `packages/ui`, which has
      # no test runner, and isolation is a property of all four client packages
      # rather than of any one app. Costs about a second; imports two source
      # files.
      - name: Guard bidi isolation
        run: bun run validate:bidi-isolation

      # The dashboard and POS were translated in #398. A hardcoded string put
      # back into either is invisible to everything else here — the JSX is
      # valid, tsc is happy and all three export jobs pass; a merchant whose
      # device is in German just sees one English word. The same step also
      # checks bundle parity, because a key missing from de.json falls back to
      # the ENGLISH string and looks correct in review. Neither app has a test
      # runner, so this is the step that carries it. Reads the tracked file
      # listing; costs a couple of seconds.
      - name: Guard dashboard and POS i18n
        run: bun run validate:i18n-strings

      # The dashboard product form must stay schema-driven (#367 step 10):
      # adding a product type is a DATA change, and a React component that knows
      # one product type by name breaks that with tsc, lint and every build job
      # still green.
      - name: Guard the schema-driven product form
        run: bun run validate:authoring-schema

      # `Money.amount` is integer MINOR units, so `{price.amount} {price.currency}`
      # prints 12345 for EUR 123.45 and 100000000 for 1 FAIR — and nothing else
      # in this repository can see it. It is valid TSX, tsc types it `number`,
      # lint is happy, and the number that appears is a plausible one. #441 found
      # three of these in shipped marketplace cards, plus two more hand-rolling
      # the conversion. Scans all four client packages (the dashboard and the POS
      # included — measured clean, unlike the RTL guard's #398 exclusion). Reads
      # the tracked file listing; costs a second.
      - name: Guard money formatting
        run: bun run validate:money-formatting

      # #367 workstream 9's non-negotiable: no category-specific or
      # product-type-specific field list, filter list, spec list or controlled
      # value anywhere in `packages/frontend`. Every shape it catches
      # type-checks, lints, builds and renders — a storefront that knows one
      # category's filters by name looks exactly like one that reads them from
      # the server, right up until an operator publishes a new attribute and
      # nobody's screen changes. Five walls, each with a vacuity floor and a
      # mutation self-test; reads the tracked file listing, costs a second.
      - name: Guard the catalog-driven storefront
        run: bun run validate:storefront-catalog

      # `services/facets/labels.ts` reports every commerce dimension and the
      # taxonomy refinement as `{ text: <machine key>, source: 'stable_key' }`,
      # deliberately: Mercaria holds no localization row for a concept with no
      # entity behind it, so the CLIENT owns that copy. The client did not own
      # it, so the rail rendered `offer_price`, `availability`, `condition`,
      # `market`, `offer_channel` and `category` to shoppers as filter titles in
      # every locale. Nothing could see it — `validate:i18n-strings` check A
      # hunts string LITERALS and these are member expressions, and `tsc` types a
      # key exactly like a word. Walks a TypeScript AST rather than grepping,
      # because the only textual occurrences in the tree are the docblocks
      # explaining the rule; the detector carries 5 positive and 5 negative
      # controls in the same run, and the two vocabularies `tsc` cannot see are
      # read out of the producing SQL. Costs a second.
      - name: Guard facet label copy
        run: bun run validate:facet-label-copy

      # `typedRoutes` checks the OBJECT form of a navigation target completely,
      # and a TEMPLATE LITERAL only when no dynamic route sits above the segment
      # that was mistyped. Measured on the dashboard, armed: mutating
      # `router.push({ pathname: "/products/wizard/[draftId]" })` gives TS2820,
      # and mutating `` router.push(`/products/wizard/${draft.id}`) `` to
      # `wizrd` exits 0 — `/products/[id]` absorbs it, because
      # `SingleRoutePart`'s multi-segment exclusion cannot discharge against the
      # unresolved `${string}` a template contributes. So the common typo — a
      # deeper segment of an otherwise-real path — ships and dies under a user's
      # thumb (#456). This resolves every target's static skeleton against the
      # real route tree on disk. Per-app vacuity floors, positive and negative
      # controls on every run, and a self-test that mutates a REAL call site;
      # reads the tracked file listing, costs a second.
      - name: Guard navigation targets against the route tree
        run: bun run validate:route-targets

      - name: Lint API
        run: bun run --filter @mercaria/backend lint

      # The three Expo apps (#496). Added together because the measurement found
      # them in the same state — 0 errors and 13 warnings between all three — so
      # there was no subset worth treating differently and nothing to ratchet.
      # They share one rule set (`eslint.config.apps.mjs`); see it for why.
      - name: Lint Storefront
        run: bun run --filter @mercaria/frontend lint
      - name: Lint Dashboard
        run: bun run --filter @mercaria/dashboard lint
      - name: Lint POS
        run: bun run --filter @mercaria/pos lint

      - name: Typecheck API
        run: bun run --filter @mercaria/backend typecheck

      - name: Typecheck UI
        run: bun run --filter @mercaria/ui typecheck

      # The three Expo apps were BUILT but never typechecked, and a build does not
      # substitute: Babel strips types, so `expo export` happily bundles code tsc
      # rejects. A shared-types change that broke the dashboard's product screen
      # passed all four existing jobs.
      - name: Typecheck Dashboard
        run: bun run --filter @mercaria/dashboard typecheck

      # The dashboard's own runner (#469), the same narrow shape as the
      # storefront's: `lib/**` only, node environment, no jsdom. It has to be
      # this package's runner rather than a case in the API suite, and that is a
      # correctness property rather than tidiness — a test importing across a
      # package boundary compiles the imported source under the IMPORTING
      # package's `strict` setting, and this package is `strict: true` where the
      # API is `strict: false`. Exercised from there, a module written to rely on
      # `strictNullChecks` would be measured without them and go green.
      #
      # It seeded on a live defect nothing else here could see: `lib/permissions.ts`
      # is a hand-kept mirror of the backend role matrix, its `ALL_PERMISSIONS` is
      # typed `readonly StorePermission[]`, and a SUBSET is assignable to that —
      # so `analytics:read` was missing from it with tsc, lint, all eight guards
      # and the export green, hiding the affordance from the store OWNER.
      - name: Test Dashboard
        run: bun run --filter @mercaria/dashboard test

      - name: Typecheck App
        run: bun run --filter @mercaria/frontend typecheck

      # The storefront's own runner (#367 workstream 9), narrow by design:
      # `lib/**` only, node environment, no jsdom. It EXECUTES the pure catalog
      # composition, where every other storefront check in this repository SCANS
      # source as text from the backend suite — and executing is what catches a
      # behavioural bug. `parseComparisonSubjects` trimmed a `?p=` entry as a
      # whole instead of each half, so a handle kept a trailing space and would
      # have 404'd, with tsc, lint, the export and all five walls of
      # `validate:storefront-catalog` green on it.
      #
      # It cannot live in the backend suite: that package's `rootDir` is its own
      # root, so a test there cannot import across packages, and excluding one
      # file to get around it also stops `parserOptions.project` parsing it.
      - name: Test App
        run: bun run --filter @mercaria/frontend test

      - name: Typecheck POS
        run: bun run --filter @mercaria/pos typecheck

      # The POS's own runner (#469), same shape and same reasoning as the two
      # above. `lib/permissions.ts` here is a byte-identical copy of the
      # dashboard's, which is exactly why it gets its own cases: two copies drift
      # one at a time, and the second one is the one nobody looks at.
      #
      # `client-test-runners.test.ts` in the API suite fails the build if a
      # package declares a `test` script that no step here runs, so a runner
      # cannot end up registered with zero callers.
      - name: Test POS
        run: bun run --filter @mercaria/pos test

      # The same lock ceiling docker-compose.postgres.yml sets, by the only
      # mechanism a service container leaves open.
      #
      # A service block accepts `image`, `credentials`, `env`, `ports`,
      # `volumes` and `options` only, and `options` is handed to `docker create`
      # BEFORE the image — so there is nowhere to append `postgres -c …` the way
      # compose does. `volumes` cannot help either: services start before
      # `actions/checkout`, so no config file from this repo exists yet.
      # `max_locks_per_transaction` is `postmaster` context, so a session cannot
      # set it. That leaves writing postgresql.auto.conf and restarting.
      #
      # If this step is deleted, the API tests do NOT silently go back to
      # flaking with `out of shared memory` under load — vitest.pg.globalSetup.ts
      # asserts the floor and fails immediately, naming this step.
      - name: Raise the Postgres lock ceiling (see docker-compose.postgres.yml)
        # Through `env` rather than interpolated into the script. The value is
        # an Actions-generated container id, not attacker-controllable, but a
        # `${{ }}` inside `run:` is the shape of a workflow injection and this
        # is the house pattern for all of them.
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          CT="$POSTGRES_CONTAINER"
          docker exec "$CT" psql -U mercaria -d mercaria_ci \
            -c "ALTER SYSTEM SET max_locks_per_transaction = 256"
          docker restart "$CT"

          # Wait on a real query rather than pg_isready, which reports ready
          # during the entrypoint's own restart, and require three consecutive
          # successes so a momentary answer mid-restart is not mistaken for one.
          ok=0
          for _ in $(seq 1 60); do
            if docker exec "$CT" psql -U mercaria -d mercaria_ci -tAc 'select 1' >/dev/null 2>&1; then
              ok=$((ok + 1))
            else
              ok=0
            fi
            [ "$ok" -ge 3 ] && break
            sleep 1
          done
          [ "$ok" -ge 3 ] || { echo "Postgres did not come back after the restart"; exit 1; }

          # Read the value back. ALTER SYSTEM succeeds whether or not the
          # restart applied it, so the write is not evidence on its own.
          applied=$(docker exec "$CT" psql -U mercaria -d mercaria_ci -tAc 'show max_locks_per_transaction')
          echo "max_locks_per_transaction = $applied"
          [ "$applied" = "256" ] || { echo "expected 256, got '$applied'"; exit 1; }

      - name: Run API tests
        # TEST_DATABASE_URL names the SERVER, never the database the tests use:
        # the harness creates its own throwaway database on it per run and drops
        # it afterwards, so `mercaria_ci` is never written to.
        env:
          TEST_DATABASE_URL: postgres://mercaria:mercaria@127.0.0.1:5432/mercaria_ci
        run: bun run --filter @mercaria/backend test

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build API
        run: bun run build:backend

  build-app:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build App (Expo web export)
        run: bun run build:frontend
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production

  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Dashboard (Expo web export)
        run: bun run build:dashboard
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production

  build-pos:
    name: Build POS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build POS (Expo web export)
        run: bun run build:pos
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
