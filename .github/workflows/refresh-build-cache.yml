name: Refresh build cache

# Weekly, rebuild the production image with NO cache and write the fresh layers
# into the GitHub Actions cache scope deploy-aws.yml reads, so the deploy's cached
# layers stop pinning an old `apt-get`/`apk` result and pick up OS security
# patches. Builds only: no AWS credentials, no push, no deploy. It runs on main
# (schedule or a dispatch from main) and writes main's cache.
# OxyHQ/oxy .github/workflows/refresh-app-image-cache.yml.

on:
  schedule:
    - cron: '17 4 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-build-cache
  cancel-in-progress: false

jobs:
  refresh:
    permissions:
      contents: read
    uses: OxyHQ/oxy/.github/workflows/refresh-app-image-cache.yml@main
    with:
      targets: >-
        [
          {"name": "mercaria", "scope": "mercaria-backend", "dockerfile": "Dockerfile"}
        ]
