name: Deploy Frontend

# WHAT IS VERIFIED BEFORE THIS SHIPS: the whole of `ci.yml` — the ten
# `validate:*` guards, five typechecks, the three app test runners and the API
# suite — asserted for THIS commit by the `gate` job below. Not the export in
# `deploy-app`: `expo export` is a bundler, Babel strips types, and it ships code
# `tsc` rejects. Measured on 2026-08-17 against `packages/pos`, a `string`
# assigned to a `number`: `tsc --noEmit` exits 2, `expo export` exits 0 and the
# mutated module is in the shipped bundle. So the build below proves the app
# BUNDLES, and nothing about whether it is correct.
#
# Until #505 this workflow had no gate at all and shipped on every push to
# `main`. See `docs/deploy.md` §"What gates a deploy".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/scripts/require-ci-success.mjs'
      - 'packages/frontend/**'
      - 'packages/ui/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'bun.lock'

# The deploy authenticates to Cloudflare with its own secret; the workflow token
# needs only enough to check out the gate script and read this commit's CI run.
permissions:
  contents: read
  actions: read

# ONE deploy of THIS app at a time, and the newest wins.
#
# This is the OPPOSITE setting from `ci.yml`, deliberately, and the asymmetry is
# the whole point: `ci.yml` owes a VERDICT PER COMMIT, so it must never cancel —
# that was the 52-of-329 bug #505 fixed. A DEPLOY owes only the NEWEST ARTIFACT,
# which is the same reasoning that makes `deploy-aws.yml`'s eviction benign.
# Two concurrency blocks with opposite settings in one repo read like a mistake
# unless the reason sits beside them, so: the difference is what each one owes.
#
# It is safe in both places it can interrupt. Cancelling a `gate` job costs
# nothing at all — it is a poll loop that has changed no state. Cancelling
# mid-`wrangler deploy` leaves the PREVIOUS Worker version live and serving,
# and the newer deploy ships moments later; a Worker version is activated after
# upload, not during it.
#
# The group is keyed PER APP. Three workflows sharing one group would serialise
# the storefront, dashboard and POS behind each other — a different bug with an
# identical green — which is why `deployGating.test.ts` asserts the key and not
# merely that some block exists.
#
# Note this gap PREDATES #505: with no block at all, two deploys of this app
# could already race to Cloudflare and nothing stopped them. What #505 changed
# is the cost of the omission — its `gate` job holds a runner for its whole
# wait (measured: nine idle gates, nine distinct assigned runner ids), so
# without this, a burst of N merges parks 3N runners against the very `ci.yml`
# runs those gates are waiting for. Measured under a real burst: 9 of 16
# running jobs were idle gates, and one `ci.yml` run went from `in_progress`
# BACK to `queued`.
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kept as a separate job rather than a first step of `deploy-app` so a refusal
  # is legible on the run page as "CI did not pass", and so the deploy job's own
  # log begins at the point something is actually being deployed.
  gate:
    name: CI passed for this commit
    runs-on: ubuntu-latest
    # Above the script's own 30-minute wait for a run to conclude, so a genuine
    # refusal is reported by the script with its reason rather than by the runner
    # killing the job.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a green CI run for this commit
        run: node .github/scripts/require-ci-success.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-app:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Build app (Expo web export)
        run: bun run build:frontend
        timeout-minutes: 60
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
          # Public, compile-time Expo env. EXPO_PUBLIC_OXY_CLIENT_ID is the
          # registered Oxy RP client id (handoff: register it and set this repo
          # variable before the SSO RP flow works); the API URL points at the
          # Mercaria backend.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID }}
          EXPO_PUBLIC_OXY_API_URL: ${{ vars.EXPO_PUBLIC_OXY_API_URL || 'https://api.oxy.so' }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api.mercaria.co' }}
      # Deploys to a Cloudflare Worker (Static Assets) named `mercaria`.
      # `workers_dev`/`preview_urls` are disabled in wrangler.jsonc so the app is
      # served ONLY via the custom domain `mercaria.co` — no `*.workers.dev` /
      # `*.pages.dev` URL is ever exposed.
      - name: Deploy to Cloudflare Workers
        working-directory: packages/frontend
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
