name: Deploy Frontend

# WHAT IS VERIFIED BEFORE THIS SHIPS: the whole of `ci.yml` — the ten
# `validate:*` guards, five typechecks, the three app test runners and the API
# suite — asserted for THIS commit by the `gate` job below. Not the export in
# `build`: `expo export` is a bundler, Babel strips types, and it ships code
# `tsc` rejects. Measured on 2026-08-17 against `packages/pos`, a `string`
# assigned to a `number`: `tsc --noEmit` exits 2, `expo export` exits 0 and the
# mutated module is in the shipped bundle. So the build below proves the app
# BUNDLES, and nothing about whether it is correct.
#
# Until #505 this workflow had no gate at all and shipped on every push to
# `main`. See `docs/deploy.md` §"What gates a deploy".

# Triggered by `ci.yml` COMPLETING on `main`, not by the push (see
# `docs/deploy.md` §"What gates a deploy"). The old push trigger made the gate
# POLL for CI for up to 30 minutes, holding a runner the whole time — one of
# four idle runners per merge on an org-wide limit of 20 concurrent jobs.
# `workflow_run` carries no `paths:`, so the old filter is the `DEPLOY_PATHS`
# list on the gate's scope step below, diffed against the last commit this
# workflow actually shipped.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# The deploy authenticates to Cloudflare with its own secret; the workflow token
# needs only enough to check out the gate script, read this commit's CI run and
# compare it with the last shipped commit.
permissions:
  contents: read
  actions: read

# ONE deploy of THIS app at a time, and the newest wins.
#
# This is the OPPOSITE setting from `ci.yml`, deliberately, and the asymmetry is
# the whole point: `ci.yml` owes a VERDICT PER COMMIT, so it must never cancel —
# that was the 52-of-329 bug #505 fixed. A DEPLOY owes only the NEWEST ARTIFACT,
# which is the same reasoning that makes `deploy-aws.yml`'s eviction benign.
# Two concurrency blocks with opposite settings in one repo read like a mistake
# unless the reason sits beside them, so: the difference is what each one owes.
#
# It is safe in both places it can interrupt. Cancelling a `gate` job costs
# nothing at all — it reads the API and has changed no state. Cancelling
# mid-`wrangler deploy` leaves the PREVIOUS Worker version live and serving,
# and the newer deploy ships moments later; a Worker version is activated after
# upload, not during it.
#
# The group is keyed PER APP. Three workflows sharing one group would serialise
# the storefront, dashboard and POS behind each other — a different bug with an
# identical green — which is why `deployGating.test.ts` asserts the key and not
# merely that some block exists.
#
# Note this gap PREDATES #505: with no block at all, two deploys of this app
# could already race to Cloudflare and nothing stopped them. What #505 changed
# is the cost of the omission — its `gate` job holds a runner for its whole
# wait (measured: nine idle gates, nine distinct assigned runner ids), so
# without this, a burst of N merges parks 3N runners against the very `ci.yml`
# runs those gates are waiting for. Measured under a real burst: 9 of 16
# running jobs were idle gates, and one `ci.yml` run went from `in_progress`
# BACK to `queued`. Since the move to `workflow_run` no gate waits at all.
#
# The `-noop-<run id>` suffix applies ONLY to a run every job of which skips
# (a superseded or foreign `ci.yml` run — the same predicate as the gate's
# `if:`, negated). Without it such a run would join the group and, with
# `cancel-in-progress: true`, cancel the real deploy in flight. Every run that
# can deploy uses exactly `deploy-frontend-<ref>`.
concurrency:
  group: deploy-frontend-${{ github.ref }}${{ github.event_name == 'workflow_run' && (github.event.workflow_run.event != 'push' || github.event.workflow_run.head_repository.full_name != github.repository || github.event.workflow_run.head_sha != github.sha) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

# The commit CI just verified. Equal to `github.sha` on every run that deploys:
# the gate's `if:` skips a run whose CI finished after a newer merge landed.
env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Kept as a separate job rather than a first step of `deploy-app` so a refusal
  # is legible on the run page as "CI did not pass", and so the deploy job's own
  # log begins at the point something is actually being deployed.
  gate:
    name: CI passed for this commit
    # Runs on a dispatch, or on a `ci.yml` run for a PUSH to THIS repository's
    # `main` whose commit is still the tip. A run of CI that finished after a
    # newer merge landed is superseded: this workflow's run carries the newer
    # commit as its `head_sha`, so shipping the older one would misreport
    # what is live and could roll production back. Such a run skips every job
    # (conclusion `skipped`, which `require-deploy-coverage.mjs` ignores) and
    # sits in its own concurrency group, so it can neither cancel nor evict a
    # real deploy; the newer commit's own CI completion deploys it.
    #
    # A CI run that FAILED is not filtered here on purpose: the gate runs and
    # refuses, so a red commit on `main` stays a red deploy run, exactly as it
    # was before `workflow_run`.
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    # Nothing here waits any more: CI has concluded before this run exists.
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
      # Asked ONCE: every required job present and `success` on the newest
      # attempt for this sha — stricter than `workflow_run.conclusion`.
      - name: Require a green CI run for this commit
        run: node .github/scripts/require-ci-success.mjs --sha="$DEPLOY_SHA" --no-wait
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The old `on.push.paths`, diffed against the last commit this workflow
      # SHIPPED (not the previous push), so a skipped run can never hide one
      # that failed. Any doubt answers `deploy=true`.
      - name: Decide whether this commit changes the frontend app
        id: scope
        run: node .github/scripts/resolve-deploy-scope.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: deploy-cloudflare.yml
          SHIPPING_JOB: deploy-app
          DEPLOY_PATHS: |
            .github/workflows/deploy-cloudflare.yml
            .github/scripts/require-ci-success.mjs
            .github/scripts/resolve-deploy-scope.mjs
            packages/frontend/**
            packages/ui/**
            packages/shared-types/**
            package.json
            bun.lock

  # The Expo export needs no secret, only the public EXPO_PUBLIC_* build config,
  # and ships nothing. It used to run WHILE the gate polled for ci.yml; now
  # that the gate answers in seconds it waits for it, so a commit that does not
  # reach this app (or whose CI failed) builds nothing at all.
  build:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Build app (Expo web export)
        run: bun run build:frontend
        timeout-minutes: 25
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
          # Public, compile-time Expo env. EXPO_PUBLIC_OXY_CLIENT_ID is the
          # registered Oxy RP client id (handoff: register it and set this repo
          # variable before the SSO RP flow works); the API URL points at the
          # Mercaria backend.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID }}
          EXPO_PUBLIC_OXY_API_URL: ${{ vars.EXPO_PUBLIC_OXY_API_URL || 'https://api.oxy.so' }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api.mercaria.co' }}
          # GoWay, where a location's place lives (ADR 0013). The SDK falls back
          # to these same canonical origins when unset; stated so a repo
          # variable can point a build at a staging GoWay.
          EXPO_PUBLIC_GOWAY_API_URL: ${{ vars.EXPO_PUBLIC_GOWAY_API_URL || 'https://api.goway.to' }}
          EXPO_PUBLIC_GOWAY_WEB_URL: ${{ vars.EXPO_PUBLIC_GOWAY_WEB_URL || 'https://goway.to' }}
      # Deploys to a Cloudflare Worker (Static Assets) named `mercaria`.
      # `workers_dev`/`preview_urls` are disabled in wrangler.jsonc so the app is
      # served ONLY via the custom domain `mercaria.co` — no `*.workers.dev` /
      # `*.pages.dev` URL is ever exposed.
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: packages/frontend/dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy-app:
    needs: [gate, build]
    # The literal `workflow_run` guard on the job that holds the credential, in
    # addition to the gate's refusal: nothing here ships a commit whose CI did
    # not conclude `success`.
    if: >-
      needs.gate.outputs.deploy == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only `wrangler.jsonc` and the built `dist/` are read here. No
      # `bun install`: `_worker.js` imports nothing, so wrangler bundles it
      # without node_modules, and `bunx wrangler@4` resolves wrangler on its
      # own exactly as it did after the install (wrangler is not in bun.lock).
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: packages/frontend/dist
      - name: Deploy to Cloudflare Workers
        working-directory: packages/frontend
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
