name: Deploy POS

# Deploys the POS web bundle to a Cloudflare Worker (Static Assets) named
# `mercaria-pos`. `workers_dev`/`preview_urls` are disabled in wrangler.jsonc so
# the app is served ONLY via the custom domain `pos.mercaria.co` — no
# `*.workers.dev` / `*.pages.dev` URL is ever exposed.
# HANDOFF: the Oxy RP client id for the POS app must be registered and the repo
# variable `EXPO_PUBLIC_OXY_CLIENT_ID_POS` set to it for the SSO RP flow to work.
#
# WHAT IS VERIFIED BEFORE THIS SHIPS: the whole of `ci.yml`, asserted for THIS
# commit by the `gate` job below. Not the export in `deploy-pos`: `expo export`
# is a bundler, Babel strips types, and it ships code `tsc` rejects — measured on
# 2026-08-17 against this very package. So the build below proves the app
# BUNDLES, and nothing about whether it is correct. Until #505 this workflow had
# no gate at all. See `docs/deploy.md` §"What gates a deploy".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pos.yml'
      - '.github/scripts/require-ci-success.mjs'
      - 'packages/pos/**'
      - 'packages/ui/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'bun.lock'

# The deploy authenticates to Cloudflare with its own secret; the workflow token
# needs only enough to check out the gate script and read this commit's CI run.
permissions:
  contents: read
  actions: read

# ONE deploy of THIS app at a time, and the newest wins. The full reasoning —
# why this is the OPPOSITE of `ci.yml`'s setting, why cancelling a gate or a
# `wrangler deploy` is safe, and why the group must be keyed PER APP rather than
# shared — is written out once in `deploy-cloudflare.yml`.
concurrency:
  group: deploy-pos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CI passed for this commit
    runs-on: ubuntu-latest
    # Above the script's own 30-minute wait for a run to conclude, so a genuine
    # refusal is reported by the script with its reason rather than by the runner
    # killing the job.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a green CI run for this commit
        run: node .github/scripts/require-ci-success.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pos:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Build POS (Expo web export)
        run: bun run build:pos
        timeout-minutes: 60
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          NODE_ENV: production
          # Public, compile-time Expo env. EXPO_PUBLIC_OXY_CLIENT_ID_POS is the
          # registered Oxy RP client id for the POS app (handoff: register it and
          # set this repo variable before the SSO RP flow works); the API URL
          # points at the Mercaria backend.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID_POS }}
          EXPO_PUBLIC_OXY_API_URL: ${{ vars.EXPO_PUBLIC_OXY_API_URL || 'https://api.oxy.so' }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'https://api.mercaria.co' }}
      - name: Deploy to Cloudflare Workers
        working-directory: packages/pos
        run: bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
